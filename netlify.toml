[build]
  command = "npm run build"
  publish = "."

# Cache longo para bibliotecas e imagens (raramente mudam)
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
